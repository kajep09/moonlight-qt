---
# Fork-only Linux AppImage build. Reuses upstream's build-appimage.yml so
# dependency bumps come along when rebasing onto upstream.
name: Fork - Linux AppImage
permissions:
  contents: read

on:
  push:
    branches:
      - custom
      - 'custom-*'
  workflow_dispatch:

concurrency:
  group: fork-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      ci_version: ${{ steps.set-ci-version.outputs.ci_version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set CI version
        id: set-ci-version
        shell: bash
        run: |
          echo "ci_version=$(cat app/version.txt)-custom.$(echo ${GITHUB_SHA} | cut -c1-7)" >> "${GITHUB_OUTPUT}"

  build-appimage:
    needs: setup
    uses: ./.github/workflows/build-appimage.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}
